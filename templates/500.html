{% extends "base.html" %}
{% block title %}服务器错误 - CineVault{% endblock %}
{% block content %}
<div class="error-page">
    <h1 class="error-code">500</h1>
    <p class="error-message">服务器开小差了，稍后再试</p>
    <button type="button" class="error-link" id="error-retry-btn">
        <i data-lucide="refresh-cw" aria-hidden="true"></i> 重试
    </button>
    <a href="/" class="error-link" style="margin-left: 0.5rem;">
        <i data-lucide="home" aria-hidden="true"></i> 回到首页
    </a>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('error-retry-btn')?.addEventListener('click', function () {
        window.location.reload();
    });
</script>
{% endblock %}
